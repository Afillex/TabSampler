[project]
name = "tabsampler"
version = "0.0.1"
description = "Turn a guitar recording into guitar tablature."
readme = "README.md"
requires-python = ">=3.13,<3.14"   # ADR 0001: basic-pitch lives in its own 3.11 env
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "librosa>=1.0",
    "soundfile>=0.14",
    "mir_eval>=0.8.2",
    "mirdata>=1.0",
    "pyyaml>=6",
    "typer>=0.27",
    "rich>=15",
    "pyguitarpro>=0.11",
]

[project.scripts]
tabsampler = "tabsampler.cli:app"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov",
    "hypothesis>=6.168",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "pre-commit>=4",
    "httpx2>=2.13.1",
]
# The learned model of Phase 2 task C4 (ADR 0041). Nothing else imports torch.
model = [
    "torch>=2.14.1,<2.15",
]
# Full songs: Demucs's htdemucs_6s guitar stem (ADR 0065). Needs the `model` group's PyTorch.
separate = [
    "demucs==4.1.0",
]
# The local web page (ADR 0058). Optional: only tabsampler.web and `tabsampler serve` use it.
web = [
    "fastapi>=0.142.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Apple-silicon Macs and Linux (CI). PyTorch 2.14.1 ships no Intel-Mac wheel, and on Intel Macs
# demucs 4.1.0 pins numpy<2 against the project's numpy>=2.5 (ADR 0065).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

# Linux, which is CI, takes the CPU-only build: the default Linux wheel brings CUDA
# libraries a CPU runner cannot use. macOS takes PyPI's, which includes MPS (ADR 0041).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabsampler"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# The scientific stack (soundfile, librosa, mirdata, mir_eval) ships no type stubs.
# Demanding them would mean vendoring stubs for four libraries; everything else about
# strict mode stays on, including reportUnknownMemberType on our own code.
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff 0.16 formats Python code blocks inside Markdown. docs/ holds the spec and the
# implementation plans -- prose artefacts that ruff must not rewrite.
extend-exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: brute-force equivalence tests",
    "slow: requires the downloaded dataset",
]
addopts = "-m 'not slow'"
