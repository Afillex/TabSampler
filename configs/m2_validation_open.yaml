# ADR 0039 on GuitarSet's validation player 00: the default, and the challenger with a cost on
# open strings played up the neck, run once each before anything is chosen. The rule in ADR
# 0039, committed with this file, decides. Validation data (ADR 0037): no test-set look.

hypothesis: >-
  On GuitarSet's validation player (00, 60 tracks, ADR 0037), the default decoder plus ADR
  0039's cost on open strings played up the neck -- one weight, fitted on DadaGP's clean
  training parts with every other weight hand-set -- places more notes on the player's string
  than the default: oracle E2 higher with the 95% track-level paired interval wholly above
  zero, and no clear drop in the chord-shape rate. Predicted gain +0.005 to +0.02, at most
  +0.033. Variable: open_up_neck. Metrics: oracle E2 and the oracle chord-shape rate;
  end-to-end figures recorded only. Split: validation.

dataset:
  name: guitarset
  data_home: data/guitarset
  channel: audio_mic

transcriber:
  exe: basic-pitch
  cache_dir: cache/note_events
  onset_threshold: 0.5
  frame_threshold: 0.3
  minimum_note_length_ms: 127.70
  model_serialization: coreml
  version_tag: basic-pitch-0.4.0

onset_tolerance: 0.05
seed: 0
