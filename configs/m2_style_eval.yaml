# One GuitarSet evaluation of the default decoder as the timing/stretch/style plan leaves it
# (docs/plans/2026-10-03-timing-stretch-style-features.md, Task 10): configs/decoder_clean.yaml
# -- weights fitted on clean DadaGP parts (ADR 0032), T = 1.1975 (ADR 0033), the hand
# stretch (ADR 0030) -- judged by E3 with the move timing of ADR 0029 and the speed limit
# of ADR 0031.
#
# Written and committed BEFORE the run. GuitarSet is evaluated once with this config and
# never used to choose anything (ADR 0003): every choice above was made on DadaGP.

hypothesis: >-
  The clean-style default decoder raises exact tab F1 on GuitarSet in both modes and lowers
  oracle calibration error, while end-to-end calibration error rises but stays under ADR
  0016's guardrail. Variable: the default decoder and E3's transition rule, which change
  together because the plan allows one look at GuitarSet -- weights (clean fit), temperature
  (1.1975 from 2.9974) and the hand stretch for the decoder; timing and speed limit for E3.
  E2 depends on the weights and the stretch (the stretch changed nothing on validation); E3
  chord shapes on the weights; E3 transitions on the fingering and the new rule; E5 on the
  weights and the temperature. Metrics: E1-E5, E2 the headline. Split: GuitarSet test, all
  360 tracks, oracle and end to end. Prediction, from DadaGP artist validation only: E2
  above 0.6878 oracle and 0.4396 end to end (the clean fit beat the hand-set weights on
  clean validation parts by +0.036, 95% paired interval +0.013 to +0.062), not reaching ADR
  0016's 0.760; E1 and E4 unchanged (1.0000 / 0.7452 placed; 1.0000 / 1.0000); E3 chord
  shapes within 0.001 of 0.9967 / 0.9904, so the oracle stays under its 0.9970 guardrail
  (the fit lowered the decoded rate by 0.0001 on validation); E3 transitions at or above
  0.998 oracle and 0.99 end to end (human tab passes 0.9988 on unseen artists) -- the first
  figures under the new rule, which set ADR 0016's transition baseline (ADR 0035); E5 below
  0.1651 oracle (the temperature is now calibrated on clean playing: 0.0757 on clean
  validation) and, end to end, above 0.1272 but below 0.3851, because a sharper decoder is
  more confident about notes the transcriber got wrong.

dataset:
  name: guitarset
  data_home: data/guitarset
  channel: audio_mic

transcriber:
  exe: basic-pitch
  cache_dir: cache/note_events
  onset_threshold: 0.5
  frame_threshold: 0.3
  minimum_note_length_ms: 127.70
  model_serialization: coreml
  version_tag: basic-pitch-0.4.0

onset_tolerance: 0.05
seed: 0
