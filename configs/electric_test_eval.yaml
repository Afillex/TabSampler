# Phase 5's look at the test sets (Task 6, docs/plans/2026-10-06-phase-5-transcriber.md): Basic
# Pitch at the thresholds chosen on Guitar-TECHS's player 3, through `tabsampler eval-m1 --split
# test` on GuitarSet and scripts/evaluate_egdb.py on EGDB. Written and committed BEFORE the run;
# logged looks (ADR 0003, ADR 0037, ADR 0050).

hypothesis: >-
  The electric string classifier (ADR 0062; cache/acoustic/electric, trained on CC BY data only,
  weight 0.5 and temperature 6.7977 calibrated on IDMT-SMT-Guitar's licks, configs/decoder_electric.yaml)
  on EGDB, 240 clips, direct input, Basic Pitch at Phase 5's thresholds: (1) oracle E2 changes
  from 0.6762 by +0.02 to +0.07 (Phase 4's SynthTab-started classifier gave +0.044, ADR 0054);
  (2) end-to-end E2 changes from 0.4547 by +0.01 to +0.05 (EGSet12, validation: +0.0543, interval
  [-0.0132, +0.1286]). Splits: EGDB test only, one look; no interval, nothing chosen. GuitarSet is
  not read: the evidence is offered for electric guitar only, and the acoustic default is unchanged.

dataset:
  name: guitarset
  data_home: data/guitarset
  channel: audio_mic

transcriber:
  exe: basic-pitch
  cache_dir: cache/note_events
  onset_threshold: 0.7
  frame_threshold: 0.4
  minimum_note_length_ms: 58.0
  model_serialization: coreml
  version_tag: basic-pitch-0.4.0

onset_tolerance: 0.05
seed: 0
