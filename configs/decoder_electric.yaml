# Decoder for clean electric guitar with audio evidence (ADR 0062; electric plan, Task 3).
#
# configs/decoder_clean.yaml, plus what the string classifier hears: trained on Guitar-TECHS's
# three players and EGFxSet's clean notes (cache/acoustic/electric, CC BY 4.0 data only),
# calibrated on IDMT-SMT-Guitar's licks (temperature 6.7977, weight 0.5 chosen there), and judged
# on EGSet12: oracle string recovery 0.7250 -> 0.7926 (+0.0676, interval [+0.0129, +0.1441]).
# Needs the `model` dependency group (PyTorch) and the trained run on disk.

hypothesis: >-
  The default decoder (configs/decoder_clean.yaml) with the electric string classifier's evidence
  (ADR 0062): weight 0.5 at temperature 6.7977, both calibrated on IDMT-SMT-Guitar's licks.

tuning:
  # Standard tuning, low E to high e, as MIDI note numbers (ADR 0008).
  open_pitches: [40, 45, 50, 55, 59, 64]
  n_frets: 22
  capo: 0

grouping:
  window_s: 0.03

# The enumeration bound, as configs/phase1_baseline.yaml explains; decode_best_effort
# relaxes it per group when a chord needs more and reports it.
max_span: 5

weights:
  move: 1.0
  span: 1.0
  high: 0.1
  open_reward: 0.25
  acoustic: 0.5  # chosen on IDMT's licks (electric plan, Task 2)
  # ADR 0039: per open string played with the hand's index at fret 5 or above. Fitted by
  # maximum likelihood on the clean parts of 600 artist-split DadaGP training songs, the
  # four weights above held at their hand-set values; 0.761549..., rounded.
  open_up_neck: 0.7615
  # Calibrated for these weights by per-note NLL on the clean parts of 300 artist-validation
  # DadaGP songs (ADR 0033's method, ADR 0039): calibration error 0.1056 at the previous
  # 1.5728, 0.0707 here -- measured on the songs it was fitted on.
  temperature: 1.2934

# Notes whose posterior falls below this are marked uncertain (ADR 0013). Not tuned.
uncertainty_threshold: 0.6

seed: 0

evidence:
  run: cache/acoustic/electric
  temperature: 6.7977
