# Decoder for clean or acoustic guitar -- the CLI's default (ADR 0032).
#
# Hand-set weights (ADR 0012) since ADR 0038. ADR 0032 had put weights fitted on clean
# DadaGP parts here, chosen on DadaGP validation (+0.0359 there); re-decided on GuitarSet's
# validation player 00 (ADR 0037), they were +0.0232 better in oracle E2 but with a 95%
# paired interval of -0.0030 to +0.0513, and lowered the chord-shape rate by 0.00076 --
# so by ADR 0038's rule, fixed before the runs, the hand-set weights came back.

hypothesis: >-
  The default decoder, for clean or acoustic guitar: hand-set cost weights, re-chosen on
  GuitarSet's validation player (ADR 0038), with a temperature calibrated for them on
  clean DadaGP parts (ADR 0033's method).

tuning:
  # Standard tuning, low E to high e, as MIDI note numbers (ADR 0008).
  open_pitches: [40, 45, 50, 55, 59, 64]
  n_frets: 22
  capo: 0

grouping:
  window_s: 0.03

# The enumeration bound, as configs/phase1_baseline.yaml explains; decode_best_effort
# relaxes it per group when a chord needs more and reports it.
max_span: 5

weights:
  move: 1.0
  span: 1.0
  high: 0.1
  open_reward: 0.25
  acoustic: 0.0
  # Calibrated for these weights by per-note NLL on the clean parts of 300 artist-validation
  # DadaGP songs (ADR 0033's method, ADR 0038): calibration error 0.2153 at the pooled
  # 2.9974, 0.0941 here -- measured on the songs it was fitted on.
  temperature: 1.5728

# Notes whose posterior falls below this are marked uncertain (ADR 0013). Not tuned.
uncertainty_threshold: 0.6

seed: 0
