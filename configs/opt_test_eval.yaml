# Phase 5's look at the test sets (Task 6, docs/plans/2026-10-06-phase-5-transcriber.md): Basic
# Pitch at the thresholds chosen on Guitar-TECHS's player 3, through `tabsampler eval-m1 --split
# test` on GuitarSet and scripts/evaluate_egdb.py on EGDB. Written and committed BEFORE the run;
# logged looks (ADR 0003, ADR 0037, ADR 0050).

hypothesis: >-
  Octave ghosts dropped (plan 2026-10-06-optimise-current, Task 3b): a transcribed note exactly 12
  semitones above a note at least as loud starting within 50 ms is removed before decoding; chosen
  on Guitar-TECHS's player 3, where end-to-end E2 rose 0.4185 -> 0.4434 (+0.0249, interval
  [-0.0253, +0.0993]) while 50 of the 101 dropped notes were played ones. Basic Pitch at Phase 5's
  thresholds, the default decoder; oracle mode unchanged. (1) EGDB, 240 clips: end-to-end E2
  changes from 0.4547 by -0.01 to +0.03, and E1 falls by 0 to 0.01. (2) GuitarSet's players 01-05,
  labelled (ADR 0055): end-to-end E2 changes from 0.4553 by -0.02 to +0.01 -- on acoustic
  recordings Basic Pitch misses notes more than it adds them. Splits: EGDB and GuitarSet test,
  both test-only; one look each; no interval, nothing chosen.

dataset:
  name: guitarset
  data_home: data/guitarset
  channel: audio_mic

transcriber:
  exe: basic-pitch
  cache_dir: cache/note_events
  onset_threshold: 0.7
  frame_threshold: 0.4
  minimum_note_length_ms: 58.0
  model_serialization: coreml
  version_tag: basic-pitch-0.4.0

onset_tolerance: 0.05
seed: 0
